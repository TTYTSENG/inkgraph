<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>墨脈連接器</title><link rel="stylesheet" href="popup.css"><script src="popup.js" type="module"></script></head><body>
<h1>墨脈研究連接器</h1><p>使用目前的一般 Chrome，不代填 Google 登入資料。</p>
<button id="pair">1．連接目前的墨脈分頁</button>
<label>文章網站網址<input id="site" type="url" placeholder="https://www.mckinsey.com/…"></label>
<button id="grant">2．允許這個網站與 Google 搜尋</button>
<button id="notebook">3．連接目前這本 Notebook</button>
<button id="disconnect">中斷墨脈連線</button><p id="status" role="status" aria-live="polite">請先在一般 Chrome 開啟 http://127.0.0.1:4317/#web。</p>
<small>只在你點擊後連接分頁。可在 Chrome 的擴充功能設定撤回網站權限；重啟墨脈後需重新連接。</small>
</body></html>
